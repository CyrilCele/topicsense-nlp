
project:
  name: topicsense-nlp
  random_seed: 42

storage:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  external_dir: data/external

datasets:
  twenty_newsgroups:
    enabled: true
    role: primary_benchmark
    domain: discussion_forums
    source: scikit-learn
    loader: fetch_20newsgroups
    task_type: multiclass
    preserve_official_splits: true
    remove_metadata_during_acquisition: false
    expected_documents: 18846
    expected_classes: 20

  ag_news:
    enabled: false
    role: cross_domain_evaluation
    domain: news
    source: Hugging Face Datasets
    task_type: multiclass

  tweet_topic:
    enabled: false
    role: cross_domain_evaluation
    domain: social_media
    source: Cardiff NLP
    variant: single_label
    task_type: multiclass

  arxiv_abstracts:
    enabled: false
    role: cross_domain_evaluation
    domain: academic_research
    source: arXiv
    task_type: multiclass

experiments:
  training_fractions:
    - 0.10
    - 0.25
    - 0.50
    - 0.75
    - 1.00
  validation_fraction: 0.15
  random_seed: 42

evaluation:
  primary_metric: f1_macro
  metrics:
    - accuracy
    - precision_macro
    - recall_macro
    - f1_macro
    - f1_weighted